# ============================================================
#  LCARS SHELL — Hyprland configuration
#  Target: Fedora 43+ (COPR), VirtualBox-friendly
#  Install: cp hypr/hyprland.conf ~/.config/hypr/hyprland.conf
# ============================================================

# --- Monitor -------------------------------------------------
# In VirtualBox the auto-detected mode usually works; if the
# resolution is wrong or blurry, set an explicit one:
#   monitor = Virtual-1, 1600x900@60, 0x0, 1
monitor = , preferred, auto, 1

# --- Environment ---------------------------------------------
# VirtualBox guests have no GPU Vulkan. If Hyprland fails to start
# in the VM, uncomment these two lines (software rendering via Mesa
# lavapipe — installed by scripts/setup-fedora.sh).
# On a real GPU you do NOT need them.
# env = WLR_RENDERER, vulkan
# env = WLR_NO_HARDWARE_CURSORS, 1

# --- Autostart ------------------------------------------------
# Launch the LCARS shell. Adjust the path if the repo lives
# somewhere other than ~/lcars-shell.
exec-once = quickshell -p $HOME/lcars-shell/shell/shell.qml
# exec-once = systemctl --user start hyprpolkitagent   # after installing hyprpolkitagent

# --- General --------------------------------------------------
general {
    gaps_in = 8
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(ffb800ee)
    col.inactive_border = rgba(10203066)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.95
}

# --- Animations -----------------------------------------------
# Tuned for VirtualBox; you can raise speeds on real hardware.
animations {
    enabled = yes
    bezier = lcars, 0.05, 0.9, 0.1, 1
    animation = windows, 1, 4, lcars
    animation = windowsOut, 1, 4, lcars, popin 80%
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, lcars, slide
    animation = border, 1, 8, default
}

dwindle {
    pseudotile = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# --- Keybindings ----------------------------------------------
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshot to clipboard (needs grim + slurp + wl-clipboard)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
